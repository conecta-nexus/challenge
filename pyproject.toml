[project]
name = "challenge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.146.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
